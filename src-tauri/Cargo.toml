[package]
name = "obsidian-plugin-sync"
version = "0.1.5"
description = "Windows desktop app for syncing Obsidian plugins across local vaults"
authors = ["Obsidian Plugin Sync"]
edition = "2021"

[lib]
name = "obsidian_plugin_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
